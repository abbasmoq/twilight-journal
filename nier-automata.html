<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c9c3ad">
  <title>NieR:Automata — YoRHa Journal</title>
  <style>
    :root{--ink:#292b29;--paper:#d4cfba;--paper2:#c5bea7;--muted:#66675f;--line:rgba(42,44,41,.28);--panel:rgba(224,220,202,.72);--accent:#686b61;--ok:#3f6659;--danger:#8a4545}
    *{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:hidden}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:Tahoma,Arial,sans-serif;background:linear-gradient(rgba(62,64,59,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(62,64,59,.055) 1px,transparent 1px),radial-gradient(circle at 50% 0,#e4dfca 0,transparent 38%),var(--paper);background-size:22px 22px,22px 22px,auto,auto}
    body.dark{--ink:#dedac8;--paper:#1e211f;--paper2:#292d29;--muted:#aaa997;--line:rgba(218,214,195,.2);--panel:rgba(35,38,35,.78);--accent:#c5c0ad;--ok:#7eb19d;background:linear-gradient(rgba(218,214,195,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(218,214,195,.035) 1px,transparent 1px),radial-gradient(circle at 50% 0,#4b5048 0,transparent 36%),var(--paper);background-size:22px 22px,22px 22px,auto,auto}
    button,input,textarea{font:inherit}.hero{position:relative;min-height:73vh;display:grid;place-items:center;padding:80px 20px 55px;text-align:center;border-bottom:1px solid var(--line)}
    .hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(0,0,0,.025) 5px)}.theme-button,.language-button{position:absolute;top:20px;height:46px;z-index:3;border:1px solid var(--line);color:var(--ink);background:var(--panel);backdrop-filter:blur(10px);cursor:pointer}.theme-button{left:20px;width:46px;border-radius:50%}.language-button{right:20px;padding:0 14px;border-radius:23px;font-weight:bold}
    .emblem{width:180px;height:180px;margin:auto;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;position:relative;animation:pulse 4s ease-in-out infinite}.emblem:before,.emblem:after{content:"";position:absolute;border:1px solid var(--ink);border-radius:50%}.emblem:before{inset:12px}.emblem:after{inset:31px}.emblem span{font:52px Georgia,serif;letter-spacing:-8px;transform:translateX(-4px)}@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 0 35px rgba(40,42,40,.18)}}
    .eyebrow{margin-top:24px;letter-spacing:5px;font-size:10px;color:var(--muted)}h1{margin:8px 0 10px;font:clamp(43px,12vw,82px) Georgia,serif;font-weight:normal;letter-spacing:-3px}.subtitle{max-width:650px;margin:auto;color:var(--muted);line-height:2}.scroll-hint{position:absolute;bottom:22px;color:var(--muted);font-size:12px;animation:bob 1.7s infinite}@keyframes bob{50%{transform:translateY(6px)}}
    .container{width:calc(100% - 28px);max-width:980px;margin:auto;padding:28px 0 70px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;padding:22px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(15px);box-shadow:0 20px 60px rgba(0,0,0,.08);clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px)}.wide{grid-column:1/-1}.card-title{margin:0 0 17px;font:24px Georgia,serif}.progress-number{font:52px Georgia,serif}.bar{height:9px;border:1px solid var(--line);background:rgba(0,0,0,.08)}.bar>i{display:block;height:100%;width:0;background:var(--ink);transition:.4s}.small{color:var(--muted);font-size:12px;line-height:1.9}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat strong{display:block;font:32px Georgia,serif}.action{width:100%;margin-top:10px;padding:12px;border:1px solid var(--ink);color:var(--paper);background:var(--ink);cursor:pointer}.secondary{color:var(--ink);background:transparent;border-color:var(--line)}.danger{color:var(--danger);border-color:rgba(138,69,69,.35)}
    .check-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.rate{font:25px Georgia,serif}.chapter{margin-top:12px;border:1px solid var(--line);background:rgba(0,0,0,.025)}.chapter.locked{opacity:.42;filter:grayscale(1)}.chapter summary{display:flex;align-items:center;gap:13px;padding:16px;list-style:none;cursor:pointer}.chapter summary::-webkit-details-marker{display:none}.num{width:39px;height:39px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:50%}.chapter-title{direction:ltr;text-align:left;font:20px Georgia,serif}.chapter-body{padding:0 16px 16px}.mission{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.mission strong{display:block;direction:ltr;text-align:left}.mission span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.7}.finish{width:100%;margin-top:13px;padding:11px;border:1px solid var(--ink);color:var(--paper);background:var(--ink)}.finish:disabled{opacity:.35}
    .tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);color:var(--muted);background:transparent}.tab.active{color:var(--paper);background:var(--ink)}.search{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);outline:0;color:var(--ink);background:rgba(255,255,255,.08)}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.entry{padding:13px;border:1px solid var(--line);background:rgba(0,0,0,.025)}.entry label{display:flex;align-items:flex-start;gap:9px}.entry strong{direction:ltr;text-align:left}.entry p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.tag{display:inline-block;margin-top:8px;padding:3px 7px;border:1px solid var(--line);font-size:10px;direction:ltr}.spoiler{filter:blur(6px);user-select:none}.reveal{margin-bottom:12px}
    textarea{width:100%;min-height:150px;padding:14px;resize:vertical;border:1px solid var(--line);outline:0;color:var(--ink);background:rgba(255,255,255,.08);line-height:1.8}.saved{min-height:18px;color:var(--ok);font-size:12px;opacity:0}.saved.show{opacity:1}footer{text-align:center;padding:25px;color:var(--muted);font-size:11px}
    @media(max-width:670px){.container{width:calc(100% - 20px)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:18px}.catalog{grid-template-columns:1fr}.hero{min-height:69vh}.stats strong{font-size:27px}}
  </style>
</head>
<body data-game-id="nier-automata" data-save-prefix="na-">
  <header class="hero">
    <button class="theme-button" id="themeButton">◐</button><button class="language-button" id="languageButton">EN</button>
    <div><div class="emblem" aria-hidden="true"><span>YH</span></div><div class="eyebrow">YoRHa FIELD RECORD</div><h1>NieR:Automata</h1><p class="subtitle" id="heroSubtitle"></p></div><div class="scroll-hint" id="scrollHint"></div>
  </header>
  <main class="container"><section class="grid">
    <article class="card"><h2 class="card-title" id="progressTitle"></h2><div class="progress-number"><span id="progressValue">0</span>%</div><div class="bar"><i id="progressBar"></i></div><p class="small" id="progressHelp"></p></article>
    <article class="card"><h2 class="card-title" id="statsTitle"></h2><div class="stats"><div class="stat"><strong id="sessions">0</strong><span class="small" id="sessionsLabel"></span></div><div class="stat"><strong id="level">1</strong><span class="small" id="levelLabel"></span></div><div class="stat"><strong id="endingCount">0</strong><span class="small" id="endingLabel"></span></div></div><button class="action" id="sessionButton"></button><button class="action secondary" id="levelButton"></button><button class="action secondary danger" id="resetStats"></button></article>
    <article class="card wide"><h2 class="card-title" id="goalsTitle"></h2><div id="goals"></div></article>
    <article class="card wide" id="journeyCard"></article><article class="card wide" id="databaseCard"></article>
    <article class="card wide"><h2 class="card-title" id="notesTitle"></h2><textarea id="notes"></textarea><p class="saved" id="savedMessage"></p></article>
  </section></main><footer id="footer"></footer>
  <script src="nier-automata.js?v=1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=3"></script><script src="game-switcher.js?v=1"></script>
</body></html>
