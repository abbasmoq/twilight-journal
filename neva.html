<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c88f7d">
  <title>Neva — Adventure Journal</title>
  <style>
    :root{--ink:#f7f2e9;--bg:#171a1d;--bg2:#26312f;--muted:#c5c4bb;--line:rgba(245,237,220,.2);--panel:rgba(26,31,32,.8);--accent:#e1b59e;--rose:#c78178;--green:#9fb9a3;--ok:#8fd0aa}
    *{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:hidden}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 18% 0,#6b4741 0,transparent 33%),radial-gradient(circle at 88% 16%,#344c47 0,transparent 32%),linear-gradient(155deg,var(--bg2),var(--bg) 72%)}
    body.light{--ink:#3d3732;--bg:#e8e0d2;--bg2:#d5c7b7;--muted:#6d665f;--line:rgba(61,55,50,.18);--panel:rgba(250,245,235,.78);background:radial-gradient(circle at 18% 0,#e8c3b2 0,transparent 34%),radial-gradient(circle at 88% 15%,#bfd0c3 0,transparent 31%),linear-gradient(155deg,#eee7dc,#d9cebf)}
    button,input,textarea{font:inherit}.hero{position:relative;min-height:72vh;display:grid;place-items:center;padding:82px 20px 55px;text-align:center;border-bottom:1px solid var(--line);overflow:hidden}
    .hero:before{content:"";position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(225,181,158,.12),transparent 31%),linear-gradient(115deg,transparent 48%,rgba(255,255,255,.03) 49%,transparent 50%)}
    .theme-button,.language-button{position:absolute;top:20px;height:46px;z-index:3;border:1px solid var(--line);color:var(--ink);background:var(--panel);backdrop-filter:blur(10px);cursor:pointer}.theme-button{left:20px;width:46px;border-radius:50%}.language-button{right:20px;padding:0 14px;border-radius:23px;font-weight:bold}
    .emblem{position:relative;width:185px;height:185px;margin:auto;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;box-shadow:0 0 70px rgba(225,181,158,.13);animation:breathe 4.5s ease-in-out infinite}.emblem:before{content:"◌";font:110px Georgia,serif;color:var(--accent);line-height:1}.emblem:after{content:"✦";position:absolute;bottom:20px;right:35px;color:var(--green);font-size:28px}@keyframes breathe{50%{transform:scale(1.025);box-shadow:0 0 85px rgba(225,181,158,.2)}}
    .eyebrow{margin-top:25px;color:var(--green);letter-spacing:5px;font-size:10px}h1{margin:8px 0 12px;font:clamp(50px,13vw,88px) Georgia,serif;font-weight:normal;letter-spacing:2px}.subtitle{max-width:680px;margin:auto;color:var(--muted);line-height:2}.scroll-hint{position:absolute;bottom:22px;color:var(--muted);font-size:12px}
    .container{width:calc(100% - 28px);max-width:980px;margin:auto;padding:28px 0 70px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.12)}.wide{grid-column:1/-1}.card-title{margin:0 0 17px;font:24px Georgia,serif}.progress-number{font:52px Georgia,serif}.bar{height:9px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.1)}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--green));transition:.4s}.small{color:var(--muted);font-size:12px;line-height:1.9}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat strong{display:block;font:32px Georgia,serif}.action{width:100%;margin-top:10px;padding:12px;border:1px solid var(--accent);border-radius:12px;color:#342721;background:var(--accent);cursor:pointer}.secondary{color:var(--ink);background:transparent;border-color:var(--line)}.danger{color:#e6a19b;border-color:rgba(230,161,155,.35)}
    .check-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--rose)}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.rate{font:25px Georgia,serif}.chapter{margin-top:12px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(0,0,0,.055)}.chapter.locked{opacity:.38;filter:grayscale(1)}.chapter summary{display:flex;align-items:center;gap:13px;padding:16px;list-style:none;cursor:pointer}.chapter summary::-webkit-details-marker{display:none}.num{width:39px;height:39px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:50%}.chapter-title{direction:ltr;text-align:left;font:20px Georgia,serif}.chapter-body{padding:0 16px 16px}.mission{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.mission strong{display:block;direction:ltr;text-align:left}.mission span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.7}.finish{width:100%;margin-top:13px;padding:11px;border:1px solid var(--accent);border-radius:10px;color:#342721;background:var(--accent)}.finish:disabled{opacity:.35}
    .tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:transparent}.tab.active{color:#342721;background:var(--accent)}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.entry{padding:13px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.045)}.entry.locked{opacity:.4}.entry label{display:flex;align-items:flex-start;gap:9px}.entry strong{direction:ltr;text-align:left}.entry p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.tag{display:inline-block;margin-top:8px;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;direction:ltr}.spoiler{filter:blur(6px);user-select:none}
    textarea{width:100%;min-height:150px;padding:14px;resize:vertical;border:1px solid var(--line);border-radius:12px;outline:0;color:var(--ink);background:rgba(0,0,0,.07);line-height:1.8}.saved{min-height:18px;color:var(--ok);font-size:12px;opacity:0}.saved.show{opacity:1}footer{text-align:center;padding:25px;color:var(--muted);font-size:11px}
    @media(max-width:670px){.container{width:calc(100% - 20px)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:18px}.catalog{grid-template-columns:1fr}.hero{min-height:68vh}.stats strong{font-size:27px}}
  </style>
</head>
<body data-game-id="neva" data-save-prefix="nv-">
  <header class="hero">
    <button class="theme-button" id="themeButton">◐</button><button class="language-button" id="languageButton">EN</button>
    <div><div class="emblem" aria-hidden="true"></div><div class="eyebrow">A SEASONAL FIELD JOURNAL</div><h1>Neva</h1><p class="subtitle" id="heroSubtitle"></p></div><div class="scroll-hint" id="scrollHint"></div>
  </header>
  <main class="container"><section class="grid">
    <article class="card"><h2 class="card-title" id="progressTitle"></h2><div class="progress-number"><span id="progressValue">0</span>%</div><div class="bar"><i id="progressBar"></i></div><p class="small" id="progressHelp"></p></article>
    <article class="card"><h2 class="card-title" id="statsTitle"></h2><div class="stats"><div class="stat"><strong id="sessions">0</strong><span class="small" id="sessionsLabel"></span></div><div class="stat"><strong id="partCount">0</strong><span class="small" id="partLabel"></span></div><div class="stat"><strong id="flowerCount">0</strong><span class="small" id="flowerLabel"></span></div></div><button class="action" id="sessionButton"></button><button class="action secondary danger" id="resetStats"></button></article>
    <article class="card wide"><h2 class="card-title" id="goalsTitle"></h2><div id="goals"></div></article>
    <article class="card wide" id="journeyCard"></article><article class="card wide" id="databaseCard"></article>
    <article class="card wide"><h2 class="card-title" id="notesTitle"></h2><textarea id="notes"></textarea><p class="saved" id="savedMessage"></p></article>
  </section></main><footer id="footer"></footer>
  <script src="neva.js?v=1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=3"></script><script src="game-switcher.js?v=1"></script>
</body></html>
